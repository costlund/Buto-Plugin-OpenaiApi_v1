readme:
  name: Buto-Plugin-OpenaiApi_v1
  date: '2024-10-08'
  description: |
    API for api.openai.com.
  item:
    -
      name: Settings
      description: |
        Put param api_key in this file.
        ````
        plugin:
          openai:
            api_v1:
              settings: 'yml:/../buto_data/theme/[theme]/openai_api_v1.yml'
        ````
        In settings file.
        ````
        api_key: _my_api_key_
        ````
    -
      name: Usage
      description: |
        Data.
        ````
        model: gpt-3.5-turbo
        messages:
          -
            role: user
            content: "How old is the world!"
        max_tokens: 1000
        temperature: 0.7
        ````


        PHP.
        ````
        $ai = new PluginOpenaiApi_v1();
        $response = $ai->api_chat_completions($data, 'my_request_tag_optional');
        ````

        Result.
        ````
        id: chat-id
        object: chat.completion
        created: 1783012530
        model: gpt-3.5-turbo-0125
        choices:
          -
            index: 0
            message:
              role: assistant
              content: 'The Earth is approximately 4.5 billion years old.'
              refusal: null
              annotations: {  }
            logprobs: null
            finish_reason: stop
        usage:
          prompt_tokens: 13
          completion_tokens: 12
          total_tokens: 25
          prompt_tokens_details:
            cached_tokens: 0
            audio_tokens: 0
          completion_tokens_details:
            reasoning_tokens: 0
            audio_tokens: 0
            accepted_prediction_tokens: 0
            rejected_prediction_tokens: 0
        service_tier: default
        system_fingerprint: null
        db:
          created_at: '2026-07-02 19:15:32'
          id: 2836000036a469cb4033ba375103454
          tag: my_request_tag_optional
          request:
            model: gpt-3.5-turbo
            messages:
              -
                role: user
                content: 'How old is the world!'
            max_tokens: 1000
            temperature: 0.7
        ````
    -
      name: Widgets
      item:
        -
          name: widget_test
          description: |
            Widget to test api.
            Change data for every new test.
            ````
            type: widget
            data:
              plugin: openai/api_v1
              method: test
              data:
                model: gpt-3.5-turbo
                messages:
                  -
                    role: system
                    content: 'You are a helpful assistant.'
                  -
                    role: user
                    content: 'Who is Donald Trump?'
                max_tokens: 100
                temperature: 0.7
            ````
    -
      name: Construct
      item:
        -
          name: __construct
          description: |
            Handle settings.
    -
      name: Methods
      item:
        -
          name: log
          description: |
            Log file /log/990101.yml to buto_data theme folder.
